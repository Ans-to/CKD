name: Blender 3D Video Experiment

on:
  # The session GitHub connection permits branch pushes but not workflow_dispatch
  # API writes; this scoped push trigger lets the experiment run without enabling
  # renders for unrelated pushes. Retain workflow_dispatch for normal use.
  push:
    branches:
      - arena/dc7dfd05-ckd
    paths:
      - .github/workflows/blender-3d-video.yml
      - scripts/blender/nokia_device_shift.py
  workflow_dispatch:
    inputs:
      frames:
        description: "Animation length in frames (24 fps; default 192 = 8 seconds)"
        required: false
        default: "192"
        type: number

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Blender and FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install --yes blender ffmpeg
          blender --version
          ffmpeg -version | head -n 1

      - name: Render the 3D animation
        env:
          FRAMES: ${{ inputs.frames }}
        run: |
          mkdir -p output/blender-frames
          set -o pipefail
          blender --background --factory-startup \
            --python scripts/blender/nokia_device_shift.py -- \
            --output-dir output/blender-frames --frames "$FRAMES" --fps 24 \
            2>&1 | tee output/blender-render.log

      - name: Include Blender failure details in the run summary
        if: failure()
        run: |
          echo '## Blender render log (last 120 lines)' >> "$GITHUB_STEP_SUMMARY"
          if [ -f output/blender-render.log ]; then
            tail -n 120 output/blender-render.log >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'The Blender process did not create a log file.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Encode MP4
        run: |
          ffmpeg -hide_banner -y -framerate 24 \
            -i output/blender-frames/frame_%04d.png \
            -c:v libx264 -preset medium -crf 20 -pix_fmt yuv420p \
            -movflags +faststart output/nokia-smartphone-shift-3d.mp4
          ffprobe -v error -show_entries format=duration,size \
            -show_entries stream=width,height,r_frame_rate,codec_name \
            -of json output/nokia-smartphone-shift-3d.mp4

      - name: Upload downloadable video artifact
        uses: actions/upload-artifact@v4
        with:
          name: nokia-smartphone-shift-3d
          path: output/nokia-smartphone-shift-3d.mp4
          if-no-files-found: error
          retention-days: 14
