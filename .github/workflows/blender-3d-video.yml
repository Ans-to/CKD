name: Blender 3D Video Experiment

on:
  # The GitHub connection permits branch pushes but not workflow_dispatch API
  # writes; this narrow push trigger keeps the experiment runnable on this branch.
  push:
    branches:
      - arena/dc7dfd05-ckd
    paths:
      - .github/workflows/blender-3d-video.yml
      - scripts/blender/nokia_device_shift.py
  workflow_dispatch:
    inputs:
      frames:
        description: "Animation length in frames (24 fps; default 96 = 4 seconds)"
        required: false
        default: "96"
        type: number

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python for Blender's published bpy wheel
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Blender Python runtime and FFmpeg
        run: |
          mkdir -p output
          set -o pipefail
          export DEBIAN_FRONTEND=noninteractive
          sudo timeout 180s apt-get update -o Acquire::Retries=1 -o Acquire::http::Timeout=40 -o Acquire::https::Timeout=40 2>&1 | tee output/package-install.log
          sudo timeout 180s apt-get install --yes libxrender1 libxfixes3 libxi6 libxkbcommon0 libsm6 libice6 libgl1 2>&1 | tee -a output/package-install.log
          python -m venv output/venv
          output/venv/bin/python -m pip install --disable-pip-version-check bpy==4.5.3 imageio-ffmpeg==0.6.0 2>&1 | tee -a output/package-install.log
          output/venv/bin/python -c 'import bpy; print("Blender Python runtime", bpy.app.version_string)'
          output/venv/bin/python -c 'import imageio_ffmpeg; print("FFmpeg", imageio_ffmpeg.get_ffmpeg_exe())'

      - name: Render the 3D animation with Blender
        env:
          FRAMES: ${{ inputs.frames }}
        run: |
          mkdir -p output/blender-frames
          set -o pipefail
          output/venv/bin/python scripts/blender/nokia_device_shift.py -- --output-dir output/blender-frames --frames "${FRAMES:-96}" --fps 24 2>&1 | tee output/blender-render.log

      - name: Include Blender failure details in the run summary
        if: failure()
        run: |
          echo '## Blender diagnostic log (last 120 lines)' >> "$GITHUB_STEP_SUMMARY"
          if [ -f output/blender-render.log ]; then
            tail -n 120 output/blender-render.log >> "$GITHUB_STEP_SUMMARY"
            detail="$(tail -n 40 output/blender-render.log | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g')"
            echo "::error title=Blender render diagnostic::${detail:0:5000}"
          elif [ -f output/package-install.log ]; then
            tail -n 120 output/package-install.log >> "$GITHUB_STEP_SUMMARY"
            detail="$(tail -n 40 output/package-install.log | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g')"
            echo "::error title=Blender installation diagnostic::${detail:0:5000}"
          else
            echo 'No diagnostic log file was created.' >> "$GITHUB_STEP_SUMMARY"
            echo '::error title=Blender diagnostic::No diagnostic log file was created.'
          fi

      - name: Encode and validate MP4
        run: |
          FFMPEG="$(output/venv/bin/python -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')"
          "$FFMPEG" -hide_banner -y -framerate 24 -i output/blender-frames/frame_%04d.png -c:v libx264 -preset medium -crf 20 -pix_fmt yuv420p -movflags +faststart output/nokia-smartphone-shift-3d.mp4
          "$FFMPEG" -v error -i output/nokia-smartphone-shift-3d.mp4 -f null -
          ls -lh output/nokia-smartphone-shift-3d.mp4

      - name: Save rendered MP4 on the session branch
        if: github.ref == 'refs/heads/arena/dc7dfd05-ckd'
        run: |
          cp output/nokia-smartphone-shift-3d.mp4 samples/nokia-smartphone-shift-3d.mp4
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add samples/nokia-smartphone-shift-3d.mp4
          git commit -m "Add rendered Blender 3D experiment video"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Upload downloadable video artifact
        uses: actions/upload-artifact@v4
        with:
          name: nokia-smartphone-shift-3d
          path: output/nokia-smartphone-shift-3d.mp4
          if-no-files-found: error
          retention-days: 14
